source = $HOME/.cache/hellwal/hyprland-colors.conf

background {
    monitor =
    path = $wallpaper
    blur_size = 6
    blur_passes = 3
    noise = 0.0117
    contrast = 1.3
    brightness = 0.3000
    vibrancy = 1.2100
    vibrancy_darkness = 0.0
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<b><span foreground='##ce0038'>$(date +"%I")</span><span foreground='##ffbfd1'>:</span><span foreground='##e8003f'>$(date +"%M")</span><span foreground='##ffbfd1'>:</span><span foreground='##ff074b'>$(date +"%S")</span> <span foreground='##ff2560'>$(date +"%p")</span></b>"
    #color = rgba(255, 0, 0, 1.0)
    font_size = 80
    font_family = Noto Sans 10
    #font_family = Geist Mono 10

    position = 0, 300
    halign = center
    valign = center
}

# Today
label {
    monitor =
    text = cmd[update:18000000] echo "<b><span foreground='##ff074b'>$(date +"%Y")</span><span foreground='##ffbfd1'>/</span><span foreground='##ff2560'>$(date +"%m")</span><span foreground='##ffbfd1'>/</span><span foreground='##ff4047'>$(date +"%d")</span></b>"
    color = rgb($color7)
    font_size = 50
    font_family = Noto Sans 10

    position = 0, 180
    halign = center
    valign = center
}

# user
label {
    monitor =
    text = cmd[update:18000000] echo "<b><span foreground='##ce0038'> $(whoami)</span> <span foreground='##ff4074'>|</span> <span foreground='##b30030'> $HOSTNAME</span></b>"
    font_family = GeistMono Nerd Font
    font_size = 17

    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:200] echo "$(brightnessctl g | awk '{if (($1 / 1200) >= 75) {print "󰃠 "} else if (($1 / 1200) >= 50) {print "󰃟 "} else if (($1 / 1200) >= 25) {print "󰃝 "} else {print "󰃞 "}}') $(wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{if ($3 == "[MUTED]") {print "󰖁 "} else if ($2 >= 0.66) {print "󰕾 "} else if ($2 >= 0.33) {print "󰖀 "} else {print "󰕿 "}}') $(if pgrep create_ap >>/dev/null; then echo "󰀂 "; else echo "󰯡 "; fi) $(if [ $(if nmcli | grep "enp3s0:" | grep " connected" >>/dev/null; then echo 1; else echo 0; fi) -eq 1 ]; then echo " "; elif [ $(if nmcli | grep "wlan0:" | grep " connected" >>/dev/null; then echo 1; else echo 0; fi) -eq 1 ]; then echo "󰖩 "; else echo "󰲛 "; fi) $(if grep "Charging" /sys/class/power_supply/BAT1/status >>/dev/null; then echo "1 $(cat /sys/class/power_supply/BAT1/capacity)"; else echo "0 $(cat /sys/class/power_supply/BAT1/capacity)"; fi | awk '{if ($1 == 1 && $2 >= 95) {print "󰂅 "} else if ($1 == 1 && $2 >= 90) {print "󰂋 "} else if ($1 == 1 && $2 >= 80) {print "󰂊 "} else if ($1 == 1 && $2 >= 70) {print "󰢞 "} else if ($1 == 1 && $2 >= 60) {print "󰂉 "} else if ($1 == 1 && $2 >= 50) {print "󰢝 "} else if ($1 == 1 && $2 >= 40) {print "󰂈 "} else if ($1 == 1 && $2 >= 30) {print "󰂇 "} else if ($1 == 1 && $2 >= 20) {print "󰂆 "} else if ($1 == 1 && $2 >= 10) {print "󰢜 "} else if ($1 == 0 && $2 >= 95) {print "󰁹"} else if ($1 == 0 && $2 >= 90) {print "󰂂"} else if ($1 == 0 && $2 >= 80) {print "󰂁"} else if ($1 == 0 && $2 >= 70) {print "󰂀"} else if ($1 == 0 && $2 >= 60) {print "󰁿"} else if ($1 == 0 && $2 >= 50) {print "󰁾"} else if ($1 == 0 && $2 >= 40) {print "󰁽"} else if ($1 == 0 && $2 >= 30) {print "󰁼"} else if ($1 == 0 && $2 >= 20) {print "󰁻"} else if ($1 == 0 && $2 >= 10) {print "󰁺"}}')‎"
    color = rgb(ffbfd1)
    font_family = GeistMono Nerd Font
    font_size = 16

    position = -20, 20
    valign = bottom
    halign = right
}

input-field {
    monitor =
    size = 250, 40
    outline_thickness = 4

    dots_size = 0.35 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.64 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rouding = -1

    rounding = 22

    outer_color = rgb(ce0038)
    inner_color = rgba(810023aa)
    font_color = rgb(ffd4df)
    fail_color = rgb(F01E1E)
    check_color = rgb(ce1900)
    capslock_color = rgb(F08A1E)

    fade_on_empty = true
    fade_timeout = 1000
    fail_timeout = 1000

    placeholder_text = <i>Password...</i> # Text rendered in the input box when it's empty.

    position = 0, -120
    halign = center
    valign = center
}
