#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = export LC_ALL=C.UTF-8
exec-once = ln -s ~/.config /tmp/user-config
exec-once = ln -s ~/.cache/hellwal /tmp/user-hellwal
exec-once = mkdir -p /tmp/user-tmp
exec-once = ln -s /tmp/user-tmp ~/tmp
exec-once = /tmp/user-config/hypr/scripts/hypr/edp-workspace
exec-once = /tmp/user-config/hypr/scripts/general/rebar
exec-once = hyprpaper
exec-once = waypaper --restore
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = XDG_MENU_PREFIX=arch- kbuildsycoca6
exec-once = hyprctl setcursor Bibata-Modern-Classic 24 
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = clipse -listen
exec-once = eww daemon
exec-once = hyprpm reload
# exec-once = ~/.bashrc_files/cava-hyprpaper-audio

exec-once = [workspace 1 silent] $terminal --hold bash -c fastfetch
exec-once = [workspace 2 silent] $browser

# exec-once = teams-for-linux
exec-once = fdm --hidden
exec-once = $vesktop
exec-once = $2fa
exec-once = $steam

exec-once = xwaylandvideobridge

